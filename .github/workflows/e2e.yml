name: E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'fistfulayen/ubtrippin' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check required secrets
        id: check
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = ['STAGING_URL', 'STAGING_SUPABASE_URL', 'STAGING_SECRET_KEY', 'STAGING_SUPABASE_PUBLISHABLE_KEY'];
          let configured = keys.every(key => Boolean(process.env[key]?.trim()));
          if (configured) {
            const app = new URL(process.env.STAGING_URL);
            const db = new URL(process.env.STAGING_SUPABASE_URL);
            configured = app.protocol === 'https:' && db.protocol === 'https:'
              && !app.username && !app.password && !db.username && !db.password
              && !['ubtrippin.xyz', 'www.ubtrippin.xyz'].includes(app.hostname)
              && db.hostname !== 'cqijgtijuselspyzpphf.supabase.co';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `configured=${configured}\n`);
          if (!configured) console.log('::warning::E2E skipped: dedicated non-production staging configuration is required.');
          NODE

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.check.outputs.configured == 'true'
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        if: steps.check.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        if: steps.check.outputs.configured == 'true'
        run: pnpm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_SHARE_TOKEN: ${{ secrets.TEST_SHARE_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.check.outputs.configured == 'true' && always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
