name: API Parity Check

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'src/app/api/**'
      - 'skill/SKILL.md'
      - 'mcp/src/**'
      - 'cli/ubt'
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/**'
      - 'skill/SKILL.md'
      - 'mcp/src/**'
      - 'cli/ubt'

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract API surface
        id: extract
        run: |
          # Find all route files and extract HTTP methods + paths
          REPORT=""
          MISSING_SKILL=""
          MISSING_MCP=""
          
          while IFS= read -r file; do
            # Convert file path to API path
            api_path=$(echo "$file" | sed 's|src/app/api/v1/||' | sed 's|/route\.ts$||' | sed -E 's/\[([^]]+)\]/:\1/g')
            api_path="/api/v1/$api_path"
            
            # Extract HTTP methods
            methods=$(grep -oP 'export async function (GET|POST|PUT|PATCH|DELETE)' "$file" | awk '{print $4}' | sort | tr '\n' ',' | sed 's/,$//')
            
            if [ -n "$methods" ]; then
              REPORT="$REPORT\n$methods $api_path"

              # Skip internal endpoints that don't belong in public docs
              skip_skill=false
              case "$api_path" in
                */admin/*|*/webhooks/stripe)
                  skip_skill=true ;;
              esac

              # Check skill coverage
              # Try exact match first, then try with params replaced by generic pattern
              skill_found=false
              if [ "$skip_skill" = true ]; then skill_found=true; fi
              if grep -qF "$api_path" skill/SKILL.md 2>/dev/null; then
                skill_found=true
              else
                # Replace :param with regex wildcard and search
                skill_regex=$(echo "$api_path" | sed 's|/:[^/]*|/:[^/]*|g')
                if grep -qP "$skill_regex" skill/SKILL.md 2>/dev/null; then
                  skill_found=true
                fi
              fi
              if [ "$skill_found" = false ]; then
                MISSING_SKILL="$MISSING_SKILL\n- $methods $api_path"
              fi
              
              # Check MCP coverage (best effort)
              # Skip internal/admin endpoints that don't belong in MCP
              skip_mcp=false
              case "$api_path" in
                */admin/*|*/webhooks/stripe|*/checkout|*/docs|*/activation/*|*/billing/*|*/referral)
                  skip_mcp=true ;;
                */invites/*/accept|*/family-invites/*|*/invites/*)
                  skip_mcp=true ;;  # Browser-based invite flows
                */events/feedback|*/events/refresh|*/inbox/*/attachments/*)
                  skip_mcp=true ;;  # UI-specific helpers
                */places/autocomplete|*/places/reverse-geocode|*/trips/demo)
                  skip_mcp=true ;;  # UI autocomplete / onboarding
              esac
              if [ "$skip_mcp" = false ] && [ -d "mcp/src" ]; then
                # Match on the resource base path (before first param)
                mcp_base=$(echo "$api_path" | sed 's|/:[^/]*.*||')
                if ! grep -rq "$mcp_base" mcp/src/ 2>/dev/null; then
                  MISSING_MCP="$MISSING_MCP\n- $methods $api_path"
                fi
              fi
            fi
          done < <(find src/app/api/v1 -name 'route.ts' | sort)
          
          # Build comment body
          COMMENT="## 🔍 API Parity Report\n\n"
          
          if [ -n "$MISSING_SKILL" ]; then
            COMMENT="$COMMENT### ⚠️ Missing from skill/SKILL.md\n$MISSING_SKILL\n\n"
          else
            COMMENT="$COMMENT### ✅ skill/SKILL.md covers all endpoints\n\n"
          fi
          
          if [ -n "$MISSING_MCP" ]; then
            COMMENT="$COMMENT### ⚠️ Possibly missing from mcp/src/\n$MISSING_MCP\n\n"
          else
            COMMENT="$COMMENT### ✅ mcp/src/ appears to cover all endpoints\n\n"
          fi
          
          COMMENT="$COMMENT<details><summary>Full API surface</summary>\n\n\`\`\`\n$(echo -e "$REPORT")\n\`\`\`\n</details>"
          
          # Save for PR comment
          echo -e "$COMMENT" > /tmp/parity-report.md
          
          # Check if there are issues
          if [ -n "$MISSING_SKILL" ] || [ -n "$MISSING_MCP" ]; then
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.extract.outputs.has_drift == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-parity
          path: /tmp/parity-report.md

  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs coverage
        run: bash scripts/ci/check-docs-coverage.sh
