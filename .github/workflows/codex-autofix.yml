name: CI Failure Triage (read-only)

# Automatic repair was retired: PR-selected code must not run with secrets
# or repository-write authority, including through workflow_run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing workflow run ID to inspect
        required: true
        type: string

permissions:
  actions: read

jobs:
  inspect:
    if: github.repository == 'fistfulayen/ubtrippin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, artifacts, package install, project scripts, model key or writes.
      - name: Read existing run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$RUN_ID" in
            ''|*[!0-9]*) echo 'run_id must contain only digits' >&2; exit 1 ;;
          esac
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" \
            --jq '{id, event, conclusion, head_branch, head_sha, html_url}'
